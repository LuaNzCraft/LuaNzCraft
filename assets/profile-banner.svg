    <rect x="1" y="75" width="520" height="3" rx="2" fill="url(#line)" />
    <text x="2" y="114" fill="#9de8f7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="5">CREATIVE DEVELOPER</text>
