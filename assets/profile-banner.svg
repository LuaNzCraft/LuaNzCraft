<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Luan Gabriel — creative developer</title>
  <desc id="desc">Banner azul-claro com formas abstratas, estrelas e detalhes rosa-neon.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b12" />
      <stop offset="0.46" stop-color="#0b2635" />
      <stop offset="1" stop-color="#79d7ec" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="76%" cy="34%" r="52%">
      <stop offset="0" stop-color="#b8f3ff" stop-opacity="0.84" />
      <stop offset="0.45" stop-color="#38bfe2" stop-opacity="0.3" />
      <stop offset="1" stop-color="#38bfe2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ddff4" stop-opacity="0" />
      <stop offset="0.5" stop-color="#d9f9ff" />
      <stop offset="1" stop-color="#7ddff4" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
