    <path d="M948 48h4v12h12v4h-12v12h-4V64h-12v-4h12Z" opacity="0.9" />
    <path d="M1132 92h3v8h8v3h-8v8h-3v-8h-8v-3h8Z" opacity="0.72" />
    <path d="M1027 262h3v8h8v3h-8v8h-3v-8h-8v-3h8Z" opacity="0.7" />
    <circle cx="884" cy="92" r="3" opacity="0.7" />
    <circle cx="1154" cy="250" r="4" opacity="0.55" />
  </g>

  <g fill="#ff1684">
