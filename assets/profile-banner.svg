    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5ecf8" stroke-opacity="0.055" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)" />
  <rect width="1200" height="320" rx="26" fill="url(#grid)" />
  <rect width="1200" height="320" rx="26" fill="url(#cyanGlow)" />

  <path d="M780-30C910 48 878 164 1035 212c73 22 123 1 195-22v160H720c62-77 48-126 60-198 11-70 65-142 0-202Z" fill="#b9f3ff" opacity="0.1" />
  <path d="M855-12c88 69 47 147 144 199 71 38 142 9 211-17v150H773c72-82 38-149 82-332Z" fill="#d8faff" opacity="0.09" />

  <circle cx="1000" cy="84" r="118" fill="#58cce8" opacity="0.16" filter="url(#softGlow)" />
  <circle cx="1084" cy="210" r="50" fill="none" stroke="#d7f9ff" stroke-width="2" stroke-opacity="0.44" />
  <circle cx="1084" cy="210" r="32" fill="none" stroke="#d7f9ff" stroke-width="1" stroke-opacity="0.25" />

